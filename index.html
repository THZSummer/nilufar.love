<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Nilufar.Love</title>

	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
		}

		html {
			height: 100%;
		}

		body {
			height: 100%;
			background-color: black;
		}

		#draw {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<canvas id="draw" ondblclick="fullscreen();"></canvas>
</body>
<script>
	function fullscreen() {
		if (document.fullscreenElement ||
			document.mozFullScreenElement ||
			document.webkitFullscreenElement ||
			document.msFullscreenElement) {
			if (document.exitFullscreen) {
				document.exitFullscreen();
			} else if (document.mozCancelFullScreen) {
				document.mozCancelFullScreen();
			} else if (document.webkitExitFullscreen) {
				document.webkitExitFullscreen();
			} else if (document.msExitFullscreen) {
				document.msExitFullscreen();
			}
		} else {
			if (document.documentElement.requestFullscreen) {
				document.documentElement.requestFullscreen();
			} else if (document.documentElement.mozRequestFullScreen) {
				document.documentElement.mozRequestFullScreen();
			} else if (document.documentElement.webkitRequestFullscreen) {
				document.documentElement.webkitRequestFullscreen();
			} else if (document.documentElement.body.msRequestFullscreen) {
				document.documentElement.body.msRequestFullscreen();
			}
		}
	}

	document.addEventListener('keypress', function (e) {
		fullscreen();
	});
</script>
<script type="text/javascript">
	var width = window.screen.availWidth;
	var height = window.screen.availHeight;

	var c = document.getElementById('draw');
	var ctx = c.getContext("2d");
	var count = 0;

	c.width = width;
	c.height = height;

	function randomColor() {
		let r = Math.round(Math.random() * Math.pow(10, 3)) % 256;
		let g = Math.round(Math.random() * Math.pow(10, 3)) % 256;
		let b = Math.round(Math.random() * Math.pow(10, 3)) % 256;
		let a = Math.random();
		return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
	}

	function randomX() {
		return Math.round(Math.random() * Math.pow(10, 4)) % width;
	}

	function randomY() {
		return Math.round(Math.random() * Math.pow(10, 4)) % height;
	}

	function changeBackgroundColor() {
		c.style.backgroundColor = randomColor();
	}

	function drawPoint() {
		ctx.beginPath();
		ctx.arc(randomX(), randomY(), 1, 0, Math.PI * 2, true);
		ctx.closePath();

		ctx.fillStyle = randomColor();
		ctx.fill();
	}

	function paintArc() {
		ctx.beginPath();	// 开始
		ctx.arc(randomX(), randomY(), randomX() % count++ + 5, 0, Math.PI * 2, true);
		ctx.closePath();	// 闭合

		ctx.strokeStyle = randomColor();	// 画笔色
		ctx.fillStyle = randomColor();	// 填充色
		ctx.stroke();	// 绘画
		ctx.fill();	// 填充

		if (count > 1314) {
			count = 0;
			ctx.clearRect(0, 0, width, height);
		}
	}

	var bcolor = setInterval('changeBackgroundColor();', 1000);
	var points = setInterval('drawPoint();', 10);
	var arc = setInterval('paintArc();', 500);

</script>

</html>
